name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # for creating the GitHub Release

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            zig_target: aarch64-macos
            brew_prefix: /opt/homebrew
          - os: macos-15-intel          # Intel runner (macos-13 was retired)
            target: macos-x86_64
            zig_target: x86_64-macos
            brew_prefix: /usr/local
          - os: ubuntu-latest
            target: linux-x86_64
            zig_target: x86_64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # Install Zig 0.16 (mlugg/setup-zig handles 0.16.0 tarball naming + mirrors).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # System deps (libmobi, libxml2, sqlite3). On macOS via Homebrew,
      # on Linux via apt. The build.zig probes both prefixes.
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update >/dev/null
          brew install libmobi sqlite

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmobi-dev libxml2-dev libsqlite3-dev

      - name: Build (Release)
        run: |
          zig build install -Doptimize=ReleaseFast

      # Quick sanity: both binaries exist and run --help.
      - name: Verify binaries
        run: |
          ls -lh zig-out/bin/biblio zig-out/bin/medias
          ./zig-out/bin/biblio --help | head -20
          ./zig-out/bin/medias --help | head -20

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/mediastacks-${{ matrix.target }}.tar.gz -C zig-out/bin biblio medias
          shasum -a 256 dist/mediastacks-${{ matrix.target }}.tar.gz \
            > dist/mediastacks-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mediastacks-${{ matrix.target }}
          path: dist/*

  # Windows ships `medias` only. Cross-compiled from Linux: `medias.exe` never
  # links libmobi/libxml2 (dead-code-eliminated), but translate-c still needs
  # their *headers* on the build host — which Linux has via apt and native
  # Windows does not. The resulting .exe runs on Windows with no extra DLLs.
  build-windows:
    name: windows-x86_64
    runs-on: macos-latest # cross-compiles cleanly (Linux's /usr/include glibc headers conflict with a Windows target)
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install header deps (for translate-c)
        run: brew install libmobi libxml2
      - name: Build (Release, Windows target)
        run: zig build install -Doptimize=ReleaseFast -Dtarget=x86_64-windows
      - name: Package
        run: |
          mkdir -p dist
          (cd zig-out/bin && zip -q ../../dist/mediastacks-windows-x86_64.zip medias.exe)
          shasum -a 256 dist/mediastacks-windows-x86_64.zip > dist/mediastacks-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mediastacks-windows-x86_64
          path: dist/*

  release:
    name: Publish release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
