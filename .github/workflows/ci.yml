name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update >/dev/null
          brew install libmobi sqlite

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmobi-dev libxml2-dev libsqlite3-dev

      - name: zig build
        run: zig build install

      - name: zig build test
        run: zig build test

      # The smoke scripts need a few sample ebooks. tests/fixtures/
      # contains tiny public-domain stubs in the repo; if it's empty
      # CI will skip per the smoke script's own guard.
      - name: smoke (CLI)
        run: bash scripts/smoke.sh --offline

      - name: smoke (web)
        run: bash scripts/smoke-web.sh

      # medias (media organizer) coverage — the active web product.
      - name: smoke (medias organize)
        run: bash scripts/organize-smoke.sh

      - name: smoke (medias web app)
        run: bash scripts/app-smoke.sh

      # Browser smoke. Only runs when Playwright + Chromium are
      # installable on the runner; the script skips itself otherwise.
      - name: setup node (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install Playwright + Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: test-e2e (Playwright)
        run: bash scripts/test-e2e.sh

  windows-cross:
    name: windows cross-compile (medias.exe)
    runs-on: macos-latest # cross to Windows from macOS; Linux's glibc headers conflict with the Windows target
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # medias.exe doesn't link libmobi/xml2, but translate-c needs their headers.
      - name: Install header deps (for translate-c)
        run: brew install libmobi libxml2
      - name: cross-compile medias for Windows
        run: zig build -Dtarget=x86_64-windows
      - name: confirm it is a Windows PE binary
        run: file zig-out/bin/medias.exe | grep -q 'PE32+'
      # Run it on a real Windows runner to validate the binary actually works.
      - uses: actions/upload-artifact@v4
        with:
          name: medias-exe-ci
          path: zig-out/bin/medias.exe

  windows-run:
    name: windows run (cross-built .exe)
    needs: windows-cross
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medias-exe-ci
      - name: run it
        run: |
          ./medias.exe --help
          ./medias.exe version

  nix:
    name: nix flake (dev shell + libmobi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: build libmobi derivation
        run: nix build .#libmobi
      - name: build in the dev shell
        run: nix develop -c zig build
